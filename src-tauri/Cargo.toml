[package]
name = "dataforge"
version = "0.4.5"
description = "AI-native database manager"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dataforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2.0"

tokio = { version = "1.41", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# DB sürücüləri (MVP: mysql + postgres + sqlite)
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls", "mysql", "postgres", "sqlite", "chrono", "json"
] }

# AI (Claude API)
reqwest = { version = "0.12", default-features = false, features = [
  "json", "rustls-tls", "stream"
] }

# Sirr + şifrələmə
keyring = { version = "3.6", features = ["windows-native"] }
aes-gcm = "0.10"
rand = "0.8"
uuid = { version = "1.11", features = ["v4"] }

# Xəta
anyhow = "1.0"
thiserror = "2.0"

# İxrac
rust_xlsxwriter = "0.79"
csv = "1.3"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# SQL Server
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }

# SSH tunnel
russh = "0.45"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

# --- v1/v2 (lazım olanda aç) ---
# mongodb = "3.1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"

